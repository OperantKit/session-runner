[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "session-runner"
dynamic = ["version"]
description = "Manual session driver for OperantKit (push events into experiment-core.Session and fan out to any EventSink)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "operantkit contributors" }]
dependencies = [
    "experiment-core>=0.1.1,<0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "black",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/session_runner/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/session_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit-level tests",
    "integration: integration-level tests spanning modules",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
